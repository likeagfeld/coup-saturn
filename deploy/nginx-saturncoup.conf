server {
    listen 80;
    server_name saturncoup.duckdns.org;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name saturncoup.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/saturncoup.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saturncoup.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /opt/coup-server/web;
    index index.html;

    # Static web files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Staging: the redesigned client, served alongside the live one -----
    #
    # DELIBERATELY ADDITIVE. The live site keeps its own root, its own files
    # and its own behaviour; nothing above this block changes. Staging is a
    # SEPARATE directory (/opt/coup-server/web-staging), so a bad deploy
    # there cannot damage what is already serving players.
    #
    # `alias` rather than `root`: with root, nginx would append the whole
    # request path and look for /opt/coup-server/web-staging/staging/... .
    # The trailing slashes on both the location and the alias are required -
    # dropping either one silently breaks path resolution.
    #
    # The internal redirect target must be the FULL path (/staging/index.html)
    # and not a bare /index.html, or a deep link under /staging would fall
    # through to the LIVE index and quietly serve the old client from a
    # staging URL - which is the one failure mode that would make staging
    # look like it works while testing the wrong build.
    # ^~ is REQUIRED, not stylistic. This config also contains
    # `location ~* \.(?:js|css)$`, a REGEX location, and nginx tests regex
    # locations BEFORE a plain prefix location wins. Without ^~ every .js and
    # .css under /staging/ is captured by that block, which has no root or
    # alias of its own and falls back to the server root - the LIVE site.
    # MEASURED from nginx's error log on the first deploy:
    #   open("/opt/coup-server/web/staging/css/style.css") failed
    # The staging index loaded (.html does not match that regex) while every
    # asset it referenced 404'd. Reordering blocks does not help; prefix vs
    # regex precedence is not positional.
    location ^~ /staging/ {
        alias /opt/coup-server/web-staging/;
        try_files $uri $uri/ /staging/index.html;

        # No caching at all here. Staging exists to be re-deployed
        # constantly, and the 5m/7d policies below are the enemy of that -
        # a tester reporting a fixed bug because they held a cached bundle
        # is worse than a slow load.
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Bare /staging -> /staging/ so the alias and try_files above apply.
    location = /staging {
        return 301 /staging/;
    }

    # JS/CSS - short cache to pick up updates quickly
    location ~* \.(?:js|css)$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    # Game assets (PNG/MP3/OGG/MP4) - cache for 7 days
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket proxy to coup-server
    location /ws {
        proxy_pass http://127.0.0.1:4823;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
