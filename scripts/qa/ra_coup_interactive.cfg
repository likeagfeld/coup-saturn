# Interactive-testing overrides ONLY, applied with --appendconfig so the
# shared retroarch.cfg (headless: video/audio null) is never written.
video_driver = "d3d11"
video_fullscreen = "false"
audio_enable = "true"
audio_driver = "xaudio"
audio_mute_enable = "false"
pause_nonactive = "false"
network_cmd_enable = "true"
network_cmd_port = "55366"

# Keyboard -> RetroPad -> Saturn pad.
# Beetle Saturn maps the Saturn pad onto RetroPad as:
#   Saturn A = RetroPad B      Saturn X = RetroPad Y
#   Saturn B = RetroPad A      Saturn Y = RetroPad L
#   Saturn C = RetroPad X      Saturn Z = RetroPad R
#   Saturn L = RetroPad L2     Saturn R = RetroPad R2
# so to get A/S/D on the Saturn A/B/C buttons the RetroPad names shift.
input_player1_b = "a"          # Saturn A  - confirm / select
input_player1_a = "s"          # Saturn B  - cancel / back
input_player1_x = "d"          # Saturn C  - alternate
input_player1_start = "enter"  # Saturn Start
input_player1_l2 = "q"         # Saturn L  - page up
input_player1_r2 = "r"         # Saturn R  - page down / RULES
input_player1_y = "z"          # Saturn X  - log scroll up
input_player1_l = "x"          # Saturn Y  - log scroll down
input_player1_r = "c"          # Saturn Z  - log reset
input_player1_up = "up"
input_player1_down = "down"
input_player1_left = "left"
input_player1_right = "right"

# --- Frame pacing -------------------------------------------------------
# The shared retroarch.cfg is a CAPTURE rig and deliberately runs unthrottled:
#   video_vsync = "false"        no vsync limiting
#   fastforward_ratio = "0.000000"   0 means UNLIMITED, not "off"
# Grabbing frames as fast as the host allows is right for a screenshot sweep
# and wrong for a human, who gets a game running at several times speed.
#
# These restore normal pacing for interactive play only. The shared file is
# never written - another agent uses this same RetroArch install.
video_vsync = "true"
audio_sync = "true"
fastforward_ratio = "1.000000"
video_frame_delay = "0"
